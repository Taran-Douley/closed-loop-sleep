[project]
name = "cloop"
version = "0.1.0"
description = "Closed-loop acoustic stimulation (CLAS) for slow-wave sleep: offline phase-targeting simulation"
authors = [
    { name = "Taran Douley", email = "271458559+Taran-Douley@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "brainflow>=5.23.0",
    "matplotlib>=3.11.2",
    "mne>=1.13.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "xlrd>=2.0.2",
    "yasa>=0.8.0",
]

[project.scripts]
cloop-phase0 = "cloop.phase0:main"
cloop-timing = "cloop.phase05:main"
cloop-baseline = "cloop.baseline:main"
cloop-phase06 = "cloop.phase06:main"
cloop-phase07 = "cloop.phase07:main"
cloop-train = "cloop.pipeline:main"
cloop-live = "cloop.live:main"
cloop-export-playback = "cloop.live:export_playback"
cloop-report = "cloop.live:report"
cloop-audio-latency = "cloop.latency:audio_main"
cloop-eeg-latency = "cloop.latency:eeg_main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
gru = ["torch>=2.5"]
audio = [
    "sounddevice>=0.5.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
